  :root {

  .search-wrap {

  .search-wrap input {
    width: 100%;
    padding: 12px 16px;
    font-size: 16px;

    border-radius: 999px;
    outline: none;
    background: var(--card);
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 16px;
  }
  .filters button {
    padding: 6px 14px;
    font-size: 13px;

    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s;
  }
  .filters button:hover { border-color: var(--accent); }
  .filters button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card.clickable {
    cursor: pointer;
  }
  .card.clickable:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    border-color: var(--accent);
  }
  .card.disabled {
    cursor: not-allowed;
    opacity: .78;
  }
  .card h3 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  .card .real {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 8px;
  }
  .card .domain {
    display: inline-block;
    font-size: 12px;
    background: var(--accent-soft);
    color: #8a5a00;
    padding: 2px 8px;
    border-radius: 6px;
    word-break: break-all;
  }
  .card.clickable .domain {
    text-decoration: none;
  }
  .card .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .tag.ok { background: #e3f6ea; color: var(--ok); }
  .tag.warn { background: #fff0d6; color: var(--warn); }
  .tag.unknown { background: #eee; color: var(--unknown); }
  .card .hint {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }
  footer {
    text-align: center;
    padding: 24px 16px 40px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
    border-top: 1px solid var(--border);
    max-width: 900px;
    margin: 0 auto;
  }
  footer a { color: var(--accent); text-decoration: none; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(43,43,43,.92);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;

  }

const STATUS_LABEL = {
  ok: "奶龙认证",
  warn: "不可用",
  unknown: "未验证"
};

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const searchEl = document.getElementById("search");
const emptyEl = document.getElementById("empty");
const toastEl = document.getElementById("toast");

let activeCategory = "全部";
let toastTimer = null;

const categories = ["全部", ...Array.from(new Set(SCHOOLS.map(s => s.category)))];

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

function buildUrl(school) {
  if (school.url) return school.url;
  if (!school.domain) return "";
  return "https://" + school.domain;
}

function openSchool(school) {
  if (school.status !== "ok") {
    showToast("「" + school.name + "」暂未开放，先去别家逛逛吧");
    return;
  }
  const url = buildUrl(school);
  if (!url) {
    showToast("这个校址还没填域名");
    return;
  }
  window.open(url, "_blank", "noopener,noreferrer");
}

function renderFilters() {
  filtersEl.innerHTML = "";
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    if (cat === activeCategory) btn.classList.add("active");
    btn.addEventListener("click", () => {
      activeCategory = cat;
      renderFilters();
      render();
    });
    filtersEl.appendChild(btn);
  });
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const list = SCHOOLS.filter(s => {
    const matchCat = activeCategory === "全部" || s.category === activeCategory;
    const matchQ = !q || [s.name, s.real, s.domain, s.category].some(v => v.toLowerCase().includes(q));
    return matchCat && matchQ;
  });

  grid.innerHTML = "";
  if (list.length === 0) {
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  list.forEach(s => {
    const card = document.createElement("div");
    const clickable = s.status === "ok";
    card.className = "card " + (clickable ? "clickable" : "disabled");
    card.setAttribute("role", clickable ? "link" : "group");
    if (clickable) {
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-label", "打开 " + s.name);
    }

    const hint = clickable
      ? "点击访问 →"
      : (s.status === "warn" ? "此网址暂时不可用" : "此校址待查，暂不可跳转");

    card.innerHTML = `
      <h3>${s.name}<span class="tag ${s.status}">${STATUS_LABEL[s.status] || s.status}</span></h3>
      <p class="real">对应：${s.real}</p>
      <span class="domain">${s.domain}</span>
      <p class="hint">${hint}</p>
    `;

    if (clickable) {
      card.addEventListener("click", () => openSchool(s));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openSchool(s);
        }
      });
    } else {
      card.addEventListener("click", () => openSchool(s));
    }

    grid.appendChild(card);
  });
}

searchEl.addEventListener("input", render);

document.getElementById("repo-link").addEventListener("click", e => {
  e.preventDefault();
  showToast("https://github.com/perryzhoupy/");
});

renderFilters();
render();
